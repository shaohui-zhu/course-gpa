<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>课程表 · 加权平均分计算器</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #ffffff;
    color: #1f2328;
    -webkit-text-size-adjust: 100%;
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 0 12px 104px; }
  .stats {
    position: sticky; top: 0; z-index: 10;
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
    background: #ffffff; padding: 12px 0; border-bottom: 1px solid #e6e8eb;
  }
  .stat { text-align: center; padding: 8px 4px; border: 1px solid #e6e8eb; border-radius: 10px; }
  .stat .label { font-size: 12px; color: #6b7280; }
  .stat .value { font-size: 22px; font-weight: 600; margin-top: 2px; }
  .stat.fails .value { color: #d92d20; }
  table { width: 100%; border-collapse: collapse; margin-top: 12px; table-layout: fixed; }
  th, td { padding: 8px 6px; border-bottom: 1px solid #eceef1; text-align: left; font-size: 14px; vertical-align: middle; }
  th { color: #6b7280; font-weight: 500; font-size: 12px; }
  col.c-credit { width: 74px; }
  col.c-score { width: 66px; }
  col.c-del { width: 44px; }
  input { width: 100%; border: 1px solid transparent; border-radius: 6px; padding: 6px; font: inherit; color: inherit; background: transparent; }
  input:hover { border-color: #e6e8eb; }
  input:focus { outline: none; border-color: #3b82f6; background: #fff; }
  input[type="number"] { text-align: center; }
  tr.fail td { color: #d92d20; }
  .del { border: none; background: transparent; color: #9aa1a9; font-size: 20px; line-height: 1; cursor: pointer; padding: 4px 6px; border-radius: 6px; }
  .del:hover { background: #f3f4f6; color: #d92d20; }
  .empty { text-align: center; color: #9aa1a9; font-size: 13px; padding: 24px 0; }
  .actions {
    position: fixed; left: 0; right: 0; bottom: 0;
    background: #fff; border-top: 1px solid #e6e8eb;
    padding: 10px 12px; display: flex; gap: 8px; justify-content: center;
  }
  .actions button { flex: 1; max-width: 220px; padding: 11px 14px; font: inherit; font-size: 15px; border-radius: 10px; border: 1px solid #d0d5dd; background: #fff; color: #1f2328; cursor: pointer; }
  .actions button.primary { background: #2563eb; border-color: #2563eb; color: #fff; }
  .actions button:active { transform: scale(0.99); }
</style>
</head>
<body>
<div class="wrap">
  <div class="stats">
    <div class="stat"><div class="label">总学分</div><div class="value" id="totalCredit">0</div></div>
    <div class="stat"><div class="label">加权平均分</div><div class="value" id="gpa">0.00</div></div>
    <div class="stat fails"><div class="label">挂科门数</div><div class="value" id="failCount">0</div></div>
  </div>
  <table>
    <colgroup>
      <col class="c-name" />
      <col class="c-credit" />
      <col class="c-score" />
      <col class="c-del" />
    </colgroup>
    <thead>
      <tr><th>课程名称</th><th>学分</th><th>成绩</th><th></th></tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
</div>
<div class="actions">
  <button id="addBtn" type="button">添加课程</button>
  <button id="loadBtn" type="button" class="primary">载入我的课程</button>
</div>
<script>
  var STORAGE_KEY = 'course-calc-v1';
  var MY_COURSES = [
    ['高等数学A(1)', 5],
    ['数据库原理', 3.5],
    ['前端开发技术', 3.5],
    ['马克思主义基本原理', 3],
    ['大学英语C(3)', 3],
    ['信号与系统', 3],
    ['线性代数B', 2.5],
    ['Java高级编程', 2.5],
    ['算法设计与分析', 2.5],
    ['嵌入式系统原理与应用', 2],
    ['后现代经典影视', 2],
    ['Linux操作系统基础', 1.5],
    ['体育(3)', 1],
    ['形势与政策(2)', 0.5],
    ['Java高级编程课程设计', 2]
  ];

  var courses = [];
  var tbody = document.getElementById('tbody');
  var elTotal = document.getElementById('totalCredit');
  var elGpa = document.getElementById('gpa');
  var elFail = document.getElementById('failCount');

  function num(v) { var n = parseFloat(v); return isNaN(n) ? 0 : n; }
  function trimNum(x) { return String(Math.round(x * 100) / 100); }
  function isFail(score) { var r = parseFloat(score); return !isNaN(r) && r < 60; }

  function compute() {
    var creditSum = 0, weighted = 0, fails = 0;
    for (var i = 0; i < courses.length; i++) {
      var cr = num(courses[i].credit);
      var sc = num(courses[i].score);
      creditSum += cr;
      weighted += cr * sc;
      if (isFail(courses[i].score)) fails++;
    }
    elTotal.textContent = trimNum(creditSum);
    elGpa.textContent = (creditSum > 0 ? weighted / creditSum : 0).toFixed(2);
    elFail.textContent = String(fails);
  }

  function makeRow(c, i) {
    var tr = document.createElement('tr');
    if (isFail(c.score)) tr.className = 'fail';

    var tdName = document.createElement('td');
    var inName = document.createElement('input');
    inName.type = 'text';
    inName.value = c.name;
    inName.placeholder = '课程名称';
    inName.setAttribute('data-field', 'name');
    inName.setAttribute('data-index', i);
    tdName.appendChild(inName);

    var tdCredit = document.createElement('td');
    var inCredit = document.createElement('input');
    inCredit.type = 'number';
    inCredit.step = '0.5';
    inCredit.min = '0';
    inCredit.inputMode = 'decimal';
    inCredit.value = c.credit;
    inCredit.setAttribute('data-field', 'credit');
    inCredit.setAttribute('data-index', i);
    tdCredit.appendChild(inCredit);

    var tdScore = document.createElement('td');
    var inScore = document.createElement('input');
    inScore.type = 'number';
    inScore.min = '0';
    inScore.max = '100';
    inScore.step = '1';
    inScore.inputMode = 'numeric';
    inScore.value = c.score;
    inScore.setAttribute('data-field', 'score');
    inScore.setAttribute('data-index', i);
    tdScore.appendChild(inScore);

    var tdDel = document.createElement('td');
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'del';
    btn.textContent = '×';
    btn.title = '删除该行';
    btn.setAttribute('data-del', i);
    tdDel.appendChild(btn);

    tr.appendChild(tdName);
    tr.appendChild(tdCredit);
    tr.appendChild(tdScore);
    tr.appendChild(tdDel);
    return tr;
  }

  function render() {
    tbody.innerHTML = '';
    if (courses.length === 0) {
      var tr = document.createElement('tr');
      var td = document.createElement('td');
      td.colSpan = 4;
      td.className = 'empty';
      td.textContent = '暂无课程，点击下方「添加课程」或「载入我的课程」';
      tr.appendChild(td);
      tbody.appendChild(tr);
    } else {
      for (var i = 0; i < courses.length; i++) tbody.appendChild(makeRow(courses[i], i));
    }
    compute();
  }

  function save() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(courses)); } catch (e) {}
  }

  function load() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return false;
      var data = JSON.parse(raw);
      if (!Array.isArray(data)) return false;
      courses = data.map(function (c) {
        return {
          name: c && c.name != null ? String(c.name) : '',
          credit: c && c.credit != null ? String(c.credit) : '',
          score: c && c.score != null ? String(c.score) : ''
        };
      });
      return true;
    } catch (e) {
      return false;
    }
  }

  tbody.addEventListener('input', function (e) {
    var t = e.target;
    var field = t.getAttribute('data-field');
    if (!field) return;
    var idx = Number(t.getAttribute('data-index'));
    if (!courses[idx]) return;
    courses[idx][field] = t.value;
    save();
    compute();
    var tr = t.closest('tr');
    if (tr) tr.className = isFail(courses[idx].score) ? 'fail' : '';
  });

  tbody.addEventListener('click', function (e) {
    var t = e.target.closest('[data-del]');
    if (!t) return;
    courses.splice(Number(t.getAttribute('data-del')), 1);
    save();
    render();
  });

  document.getElementById('addBtn').addEventListener('click', function () {
    courses.push({ name: '', credit: '', score: '' });
    save();
    render();
    var names = tbody.querySelectorAll('input[data-field="name"]');
    if (names.length) names[names.length - 1].focus();
  });

  document.getElementById('loadBtn').addEventListener('click', function () {
    courses = MY_COURSES.map(function (item) {
      return { name: item[0], credit: String(item[1]), score: '75' };
    });
    save();
    render();
  });

  if (!load()) courses = [];
  render();
</script>
</body>
</html>
